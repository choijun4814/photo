name: build

on:
  push:
    paths:
      - 'project.zip'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract project ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -rf src
          mkdir -p src
          unzip -q project.zip -d src
          echo 'ZIP top-level contents:'
          find src -maxdepth 3 -type f | sort | head -80

      - name: Locate Android project root
        id: project
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_DIR="$(find "$GITHUB_WORKSPACE/src" -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit | xargs -r dirname)"
          if [[ -z "$PROJECT_DIR" ]]; then
            PROJECT_DIR="$(find "$GITHUB_WORKSPACE/src" -type f \( -name build.gradle -o -name build.gradle.kts \) -print -quit | xargs -r dirname)"
          fi
          if [[ -z "$PROJECT_DIR" || ! -d "$PROJECT_DIR/app" ]]; then
            echo 'Could not locate Android project root containing app/ and settings.gradle(.kts).' >&2
            exit 1
          fi
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Using Android project: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Build debug APK
        shell: bash
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail
          if [[ -f ./gradlew ]]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      - name: Verify APK and record build metadata
        id: apk
        shell: bash
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          BUILD_TIME="$(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "build_time=$BUILD_TIME" >> "$GITHUB_OUTPUT"
          mkdir -p "$GITHUB_WORKSPACE/release"
          cp "$APK" "$GITHUB_WORKSPACE/release/app-debug.apk"
          sha256sum "$GITHUB_WORKSPACE/release/app-debug.apk" | tee "$GITHUB_WORKSPACE/release/SHA256.txt"
          echo "Build timestamp: $BUILD_TIME" > "$GITHUB_WORKSPACE/release/BUILD_INFO.txt"
          echo "Commit: $GITHUB_SHA" >> "$GITHUB_WORKSPACE/release/BUILD_INFO.txt"
          echo "Source: project.zip" >> "$GITHUB_WORKSPACE/release/BUILD_INFO.txt"

      - name: Publish APK release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$TAG" \
            release/app-debug.apk \
            release/BUILD_INFO.txt \
            release/SHA256.txt \
            --title "아이앨범 APK 빌드 ${GITHUB_RUN_NUMBER}" \
            --notes "Source commit: ${GITHUB_SHA}\nBuild time: ${{ steps.apk.outputs.build_time }}\nBuilt from repository project.zip."
